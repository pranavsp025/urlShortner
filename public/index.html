<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="container">

    <h1>URL Shortener</h1>

    <input
      type="text"
      id="urlInput"
      placeholder="Enter URL"
    />

    <input
      type="text"
      id="shortCodeInput"
      placeholder="Custom short code (optional)"
    />

    <button id="shortenBtn">
      Shorten URL
    </button>

    <div id="result"></div>

    <h2>All URLs</h2>

    <div id="urlList"></div>

  </div>

  <script src="/app.js"></script>

</body>
</html>
